<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>望月 | ✦ ILLUSIONARY.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .prompt-detail { max-width: 900px; margin: 0 auto; padding: 28px 18px 64px; }
    .record-kicker { color: var(--blue, #5757ff); font: 12px monospace; letter-spacing: .18em; }
    .character-name { margin: 10px 0 6px; overflow-wrap: anywhere; }
    .record-meta { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 24px; }
    .record-meta span { border:1px solid currentColor; padding:5px 9px; font:11px monospace; letter-spacing:.08em; }
    .prompt-panel { border:1px solid rgba(87,87,255,.65); background:rgba(5,5,5,.78); padding:16px; }
    .prompt-panel pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:12px/1.7 monospace; color:var(--white,#f7f7ff); }
    .prompt-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .prompt-actions button, .back-link { cursor:pointer; display:inline-block; border:1px solid var(--blue,#1717ff); background:transparent; color:inherit; padding:10px 14px; font:12px monospace; letter-spacing:.08em; text-decoration:none; }
    .prompt-actions button:hover, .back-link:hover { background:var(--blue,#1717ff); color:#fff; }
    .detail-image { width:100%; max-width:420px; aspect-ratio:1; object-fit:cover; display:block; margin:20px auto; border:1px solid rgba(87,87,255,.55); }
    .image-missing { display:none; }
    .small-label { color:rgba(247,247,255,.62); font:11px monospace; letter-spacing:.1em; margin:22px 0 8px; }
  </style>
</head>
<body>
  <main class="prompt-detail">
    <div class="record-kicker">CHARACTER RECORD / 030</div>
    <h1 class="character-name">望月</h1>
    <div class="record-meta">
      <span>MALE</span><span>WITH OUTFIT</span><span>OC</span>
    </div>
    <img class="detail-image" src="images/character-030.jpg" alt="望月" onerror="this.classList.add('image-missing')">
    <div class="small-label">PROMPT FILE / 030</div>
    <section class="prompt-panel" aria-label="Character prompt">
      <pre id="character-prompt"></pre>
    </section>
    <div class="prompt-actions">
      <button type="button" id="copy-prompt">COPY PROMPT</button>
      <a class="back-link" href="index.html">BACK TO INDEX</a>
    </div>
  </main>
  <script>
    const promptText = "masterpiece, best quality, ultra detailed, absurdres, boy, solo, adult male, japanese dark fantasy, moon rabbit spirit,\n\n1.5::slender elegant physique, long limbs, narrow waist, pale porcelain skin, delicate androgynous facial features, sharp chin, narrow rose-colored eyes, crescent-shaped pupils, long pale eyelashes, subtle pink eyeshadow, faint beauty mark beneath left eye, small knowing smile, languid gaze, slightly pointed canine teeth::,\n\n1.5::long silky pearl-white hair, waist-length hair, layered flowing hair, soft lavender-pink gradient at hair tips, long parted bangs framing face, wispy strands across forehead, loose side braid decorated with tiny sakura blossoms, long white rabbit ears with dusty pink inner fur, one ear standing upright and the other drooping slightly, fluffy white rabbit tail, faint pink markings resembling flower petals around temples::,\n\n1.5::elegant black and pale pink kimono-inspired ensemble, asymmetrical layered kimono jacket, wide flowing sleeves, black silk outer robe with delicate sakura embroidery, pale blush-pink inner kimono, deep plum obi belt, translucent pink fabric draped from shoulders, long split hakama trousers, embroidered crescent moons along hems, ornamental silver chains at waist, pink crystal tassels, black tabi boots with lacquered soles, delicate floral hairpins, silver moon-shaped earrings, thin black choker with a dangling pearl::,\n\n1.4::mystical rabbit spirit, translucent pale pink crescent markings along collarbone, tiny sakura petals floating around ears, subtle luminous dust trailing from fingertips, faint moonlight glow beneath skin, elongated elegant nails painted muted rose, supernatural beauty, quiet mischievous aura::,";
    document.getElementById("character-prompt").textContent = promptText;
    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const button = document.getElementById("copy-prompt");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(promptText);
        } else {
          const field = document.createElement("textarea");
          field.value = promptText;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          if (!ok) throw new Error("copy failed");
        }
        button.textContent = "COPIED!";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      } catch (error) {
        button.textContent = "COPY FAILED";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      }
    });
  </script>
</body>
</html>
