<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アルヴェリヒ | ✦ ILLUSIONARY.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .prompt-detail { max-width: 900px; margin: 0 auto; padding: 28px 18px 64px; }
    .record-kicker { color: var(--blue, #5757ff); font: 12px monospace; letter-spacing: .18em; }
    .character-name { margin: 10px 0 6px; overflow-wrap: anywhere; }
    .record-meta { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 24px; }
    .record-meta span { border:1px solid currentColor; padding:5px 9px; font:11px monospace; letter-spacing:.08em; }
    .prompt-panel { border:1px solid rgba(87,87,255,.65); background:rgba(5,5,5,.78); padding:16px; }
    .prompt-panel pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:12px/1.7 monospace; color:var(--white,#f7f7ff); }
    .prompt-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .prompt-actions button, .back-link { cursor:pointer; display:inline-block; border:1px solid var(--blue,#1717ff); background:transparent; color:inherit; padding:10px 14px; font:12px monospace; letter-spacing:.08em; text-decoration:none; }
    .prompt-actions button:hover, .back-link:hover { background:var(--blue,#1717ff); color:#fff; }
    .detail-image { width:100%; max-width:420px; aspect-ratio:1; object-fit:cover; display:block; margin:20px auto; border:1px solid rgba(87,87,255,.55); }
    .image-missing { display:none; }
    .small-label { color:rgba(247,247,255,.62); font:11px monospace; letter-spacing:.1em; margin:22px 0 8px; }
  </style>
</head>
<body>
  <main class="prompt-detail">
    <div class="record-kicker">CHARACTER RECORD / 022</div>
    <h1 class="character-name">アルヴェリヒ</h1>
    <div class="record-meta">
      <span>MALE</span><span>WITH OUTFIT</span><span>OC</span>
    </div>
    <img class="detail-image" src="images/character-022.jpg" alt="アルヴェリヒ" onerror="this.classList.add('image-missing')">
    <div class="small-label">PROMPT FILE / 022</div>
    <section class="prompt-panel" aria-label="Character prompt">
      <pre id="character-prompt"></pre>
    </section>
    <div class="prompt-actions">
      <button type="button" id="copy-prompt">COPY PROMPT</button>
      <a class="back-link" href="index.html">BACK TO INDEX</a>
    </div>
  </main>
  <script>
    const promptText = "masterpiece, best quality, ultra detailed, absurdres, boy, solo, adult male, vampire, supernatural humanoid,\n\n1.5::elongated skeletal silhouette, narrow waist, unnaturally long arms, bony fingers, elegant but unsettling proportions::,\n1.4::thin eyebrows, narrow delicate eyebrows, slightly uneven eyebrows::,\n1.4::deep-set eyes, heavy drooping eyelids, narrow crimson irises, tiny pupils::,\n1.4::prominent elongated vampire fangs, slightly parted lips, blood-stained lower lip::,\n\nashen gray skin with faint violet undertones, branching black veins visible beneath translucent skin, one cloudy silver eye, the other deep garnet red, sunken temples, sharp cheekbones, narrow pointed chin, subtle cracks around the mouth resembling fractured porcelain, small black crystalline growths emerging from the collarbones, elongated pointed ears with torn edges, long black hair gathered into a loose low knot, thin stray strands framing the face, silver-gray streaks resembling old candle soot,\n\n1.5::original gothic vampire design, decaying ecclesiastical ornamentation, translucent stained-glass exoskeleton::,\nasymmetrical mourning coat with one oversized sculptural shoulder, high folded collar resembling overlapping raven feathers, fitted black velvet vest, antique silver clasps, narrow wine-red silk lining, translucent smoky crystal plates attached along one side of the torso, layered coat tails resembling broken stained-glass shards, intricate black embroidery depicting thorny vines and arterial branches, antique rosary chains integrated into the waist harness, small sealed glass vials containing dark red liquid, fingerless gloves with articulated metal finger caps, narrow tailored trousers, pointed boots with oxidized silver heels, elongated black crystal protruding from the sternum, thin glass-like ribs visible beneath the coat opening, tiny droplets of suspended crimson liquid trapped inside translucent ornaments, tarnished silver, aged velvet, brittle crystal, cracked enamel, intricate craftsmanship, black, bone-white, muted burgundy and oxidized silver palette,";
    document.getElementById("character-prompt").textContent = promptText;
    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const button = document.getElementById("copy-prompt");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(promptText);
        } else {
          const field = document.createElement("textarea");
          field.value = promptText;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          if (!ok) throw new Error("copy failed");
        }
        button.textContent = "COPIED!";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      } catch (error) {
        button.textContent = "COPY FAILED";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      }
    });
  </script>
</body>
</html>
