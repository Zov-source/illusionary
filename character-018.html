<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シルヴァ | ✦ ILLUSIONARY.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .prompt-detail { max-width: 900px; margin: 0 auto; padding: 28px 18px 64px; }
    .record-kicker { color: var(--blue, #5757ff); font: 12px monospace; letter-spacing: .18em; }
    .character-name { margin: 10px 0 6px; overflow-wrap: anywhere; }
    .record-meta { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 24px; }
    .record-meta span { border:1px solid currentColor; padding:5px 9px; font:11px monospace; letter-spacing:.08em; }
    .prompt-panel { border:1px solid rgba(87,87,255,.65); background:rgba(5,5,5,.78); padding:16px; }
    .prompt-panel pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:12px/1.7 monospace; color:var(--white,#f7f7ff); }
    .prompt-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .prompt-actions button, .back-link { cursor:pointer; display:inline-block; border:1px solid var(--blue,#1717ff); background:transparent; color:inherit; padding:10px 14px; font:12px monospace; letter-spacing:.08em; text-decoration:none; }
    .prompt-actions button:hover, .back-link:hover { background:var(--blue,#1717ff); color:#fff; }
    .detail-image { width:100%; max-width:420px; aspect-ratio:1; object-fit:cover; display:block; margin:20px auto; border:1px solid rgba(87,87,255,.55); }
    .image-missing { display:none; }
    .small-label { color:rgba(247,247,255,.62); font:11px monospace; letter-spacing:.1em; margin:22px 0 8px; }
  </style>
</head>
<body>
  <main class="prompt-detail">
    <div class="record-kicker">CHARACTER RECORD / 018</div>
    <h1 class="character-name">シルヴァ</h1>
    <div class="record-meta">
      <span>MALE</span><span>WITH OUTFIT</span><span>OC</span>
    </div>
    <img class="detail-image" src="images/character-018.jpg" alt="シルヴァ" onerror="this.classList.add('image-missing')">
    <div class="small-label">PROMPT FILE / 018</div>
    <section class="prompt-panel" aria-label="Character prompt">
      <pre id="character-prompt"></pre>
    </section>
    <div class="prompt-actions">
      <button type="button" id="copy-prompt">COPY PROMPT</button>
      <a class="back-link" href="index.html">BACK TO INDEX</a>
    </div>
  </main>
  <script>
    const promptText = "masterpiece, best quality, ultra detailed, absurdres, boy, solo, adult male, mysterious celestial humanoid,\n\n1.5::small floating stars orbiting around his head, several tiny luminous five-pointed stars suspended at different heights around his temples and crown, miniature stars following curved orbital paths, delicate golden-white starlight, clearly visible separate floating stars::,\n\n1.7::hair with a miniature universe inside, cosmic inner hair, deep space visible between separated hair strands, inner layers of hair filled with swirling nebulae, tiny stars and distant galaxies embedded inside the hair, outer hair surface contrasting with the luminous cosmic interior::,\n\n1.4::thin eyebrows, narrow delicate eyebrows, softly angled eyebrows::,\nmedium-length layered silver-gray hair, asymmetrical curtain fringe, wind-separated locks, slightly longer hair behind the ears, outward-curving side strands, fine feathered tips, pale moonlit outer hair, deep midnight-blue inner layers, luminous violet nebulae and turquoise star clusters visible within the hair, subtle cosmic gradients confined to the inner hair, tiny constellations drifting beneath translucent strands,\n\npale cool-toned skin, narrow sleepy eyes, muted gold irises with tiny star-shaped highlights, faint dark circles, long eyelashes, sharp nose bridge, subtle beauty mark beneath one eye, calm absent-minded expression, slightly parted lips, slender elongated fingers, lean elegant physique,\n\n1.5::original celestial illusionist design, astronomical instrument motifs, refined eccentric silhouette::,\nhigh-neck midnight-blue tailored coat with a split asymmetric collar, one shoulder draped with translucent star-chart fabric, fitted charcoal waistcoat embroidered with fine orbital diagrams, silver thread tracing miniature constellations along the seams, layered inner panels resembling folded observatory charts, narrow pale-gold piping, asymmetrical waist sash, small antique brass astrolabe attached to the belt, crescent-shaped metal fasteners, glass pendulum ornaments, star-map lining visible inside the coat tails, fitted dark trousers, pointed ankle boots with metallic heel details, delicate rings engraved with planetary symbols, one long translucent glove patterned with faint constellations, midnight blue, silver-gray, muted violet, pale turquoise, antique gold accents, matte wool, translucent organza, brushed silver,";
    document.getElementById("character-prompt").textContent = promptText;
    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const button = document.getElementById("copy-prompt");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(promptText);
        } else {
          const field = document.createElement("textarea");
          field.value = promptText;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          if (!ok) throw new Error("copy failed");
        }
        button.textContent = "COPIED!";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      } catch (error) {
        button.textContent = "COPY FAILED";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      }
    });
  </script>
</body>
</html>
