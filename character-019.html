<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キロス | ✦ ILLUSIONARY.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .prompt-detail { max-width: 900px; margin: 0 auto; padding: 28px 18px 64px; }
    .record-kicker { color: var(--blue, #5757ff); font: 12px monospace; letter-spacing: .18em; }
    .character-name { margin: 10px 0 6px; overflow-wrap: anywhere; }
    .record-meta { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 24px; }
    .record-meta span { border:1px solid currentColor; padding:5px 9px; font:11px monospace; letter-spacing:.08em; }
    .prompt-panel { border:1px solid rgba(87,87,255,.65); background:rgba(5,5,5,.78); padding:16px; }
    .prompt-panel pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:12px/1.7 monospace; color:var(--white,#f7f7ff); }
    .prompt-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .prompt-actions button, .back-link { cursor:pointer; display:inline-block; border:1px solid var(--blue,#1717ff); background:transparent; color:inherit; padding:10px 14px; font:12px monospace; letter-spacing:.08em; text-decoration:none; }
    .prompt-actions button:hover, .back-link:hover { background:var(--blue,#1717ff); color:#fff; }
    .detail-image { width:100%; max-width:420px; aspect-ratio:1; object-fit:cover; display:block; margin:20px auto; border:1px solid rgba(87,87,255,.55); }
    .image-missing { display:none; }
    .small-label { color:rgba(247,247,255,.62); font:11px monospace; letter-spacing:.1em; margin:22px 0 8px; }
  </style>
</head>
<body>
  <main class="prompt-detail">
    <div class="record-kicker">CHARACTER RECORD / 019</div>
    <h1 class="character-name">キロス</h1>
    <div class="record-meta">
      <span>FEMALE</span><span>WITH OUTFIT</span><span>OC</span>
    </div>
    <img class="detail-image" src="images/character-019.jpg" alt="キロス" onerror="this.classList.add('image-missing')">
    <div class="small-label">PROMPT FILE / 019</div>
    <section class="prompt-panel" aria-label="Character prompt">
      <pre id="character-prompt"></pre>
    </section>
    <div class="prompt-actions">
      <button type="button" id="copy-prompt">COPY PROMPT</button>
      <a class="back-link" href="index.html">BACK TO INDEX</a>
    </div>
  </main>
  <script>
    const promptText = "masterpiece, best quality, ultra detailed, absurdres, girl, solo, adult woman, dark fantasy, gothic casino aesthetic,\n\n1.5::tall slender figure, elegant long limbs, narrow waist, graceful posture, cool ivory skin, sharp cheekbones, narrow amethyst eyes, diamond-shaped pupils, long dark eyelashes, subtle smoky eye makeup, confident enigmatic smile, small beauty mark beneath one eye::,\n\n1.5::long midnight blue hair, glossy waist-length hair, sleek straight hair with asymmetrical layers, side-swept bangs partially covering one eye, subtle violet highlights, thin silver hair strands resembling spider silk, intricate crystal hair ornaments, translucent gemstone spider legs emerging from upper back, four pairs of slender articulated appendages, dark faceted crystal tips, delicate web-like filaments connecting the appendages::,\n\n1.5::luxurious black tailored casino suit, fitted cropped jacket with sharp lapels, deep violet satin lining, high-neck sheer blouse, structured corset waistcoat, asymmetrical shorts over translucent black tights, elegant garter straps, pointed ankle boots with crystal heels, long black gloves, silver cufflinks shaped like tiny dice, diamond-pattern embroidery along jacket edges, delicate silver chains draped across hips, amethyst brooch at collar::,\n\n1.5::ornate gemstone jewelry, faceted amethyst choker, dangling diamond earrings, multiple silver rings set with colorful gemstones, transparent crystal dice suspended from a fine chain, jeweled spider brooch at waist, miniature roulette-wheel pendant, polished black gemstone nail art::,\n\n1.4::supernatural spider dealer, crystalline exoskeleton details along shoulders and spine, translucent web patterns shimmering across forearms, faint violet light beneath skin, tiny gemstone fragments floating around fingertips, eight-limbed silhouette, elegant predatory movements, mysterious supernatural aura::,";
    document.getElementById("character-prompt").textContent = promptText;
    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const button = document.getElementById("copy-prompt");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(promptText);
        } else {
          const field = document.createElement("textarea");
          field.value = promptText;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          if (!ok) throw new Error("copy failed");
        }
        button.textContent = "COPIED!";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      } catch (error) {
        button.textContent = "COPY FAILED";
        setTimeout(() => button.textContent = "COPY PROMPT", 1500);
      }
    });
  </script>
</body>
</html>
