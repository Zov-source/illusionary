<body class="detail-page"><div class="scanlines" aria-hidden="true"></div>
<header class="site-header"><a class="wordmark" href="index.html"><span class="wordmark-symbol">✦</span> ILLUSIONARY<span class="blue">.</span></a><span class="header-note">PROMPT FILE <span class="blue">/ 010</span></span></header>
<main class="detail-main">
<a class="back-link" href="index.html">← BACK TO INDEX</a>
<div class="detail-topline"><span>CHARACTER RECORD / 010</span><span>STATUS: AVAILABLE</span></div>

  <section class="detail-copy">
    <span class="micro-label">SPECIMEN NO.010</span>
    <h1>Character Name <span class="blue">010.</span></h1>

    <div class="prompt-box" id="prompt">ここにプロンプトを入力してください。</div>
    <button class="copy-button" id="copy-button" type="button">▣　COPY TO CLIPBOARD ↗</button>

<script>
const button=document.getElementById("copy-button"), promptElement=document.getElementById("prompt"), note=document.getElementById("copy-note");
button.addEventListener("click",async()=>{const promptText=promptElement.innerText;try{await navigator.clipboard.writeText(promptText);note.textContent="✓ COPIED — PROMPT SAVED TO CLIPBOARD";}catch(e){const area=document.createElement("textarea");area.value=promptText;document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();note.textContent=ok?"✓ COPIED — PROMPT SAVED TO CLIPBOARD":"コピーできませんでした。プロンプトを長押ししてコピーしてください。";}});
</script></body></html>
